      additionalProperties: false
      required:
        - positionRef
        - filledQuantityFixed6
        - sealedPriceMinorUnitsFixed6
        - fillPriceSourceRef
        - markPriceSourceRef
        - realizedPnlMinorUnits
        - unrealizedPnlMinorUnits
        - feeMinorUnits
        - taxMinorUnits
        - asOf
        - truthClass
        - sourceRefs
      properties:
        positionRef:
          $ref: '#/components/schemas/Uuid'
        filledQuantityFixed6:
          oneOf:
            - type: integer
            - type: 'null'
        sealedPriceMinorUnitsFixed6:
          oneOf:
            - type: integer
            - type: 'null'
        fillPriceSourceRef:
          oneOf:
            - $ref: '#/components/schemas/Digest'
            - type: 'null'
        markPriceSourceRef:
          oneOf:
            - $ref: '#/components/schemas/Digest'
            - type: 'null'
        realizedPnlMinorUnits:
          type: integer
        unrealizedPnlMinorUnits:
          oneOf:
            - type: integer
            - type: 'null'
        feeMinorUnits:
          type: integer
        taxMinorUnits:
          type: integer
        asOf:
          type: string
          format: date-time
        truthClass:
          $ref: '#/components/schemas/TruthClass'
        sourceRefs:
          $ref: '#/components/schemas/ArchiveSourceRefs'
    EvidenceQuotedUtterance:
      type: object
      description: A sealed `UtteranceArtifactV1`, verbatim, with its surface.
