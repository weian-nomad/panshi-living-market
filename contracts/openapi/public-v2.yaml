    WorldStreamEventEnvelope:
      type: object
      description: >-
        The JSON shape carried in each SSE frame's `data:` field for
        `GET /events/v2/world`. This only signals "resource changed" —
        never authoritative content; clients must re-`GET` `resourceRef`.
      additionalProperties: false
      required: [eventKind, resourceRef, checkpointCursor, visibilityEpoch, serverNow]
      properties:
        eventKind:
          type: string
          enum:
            - world_tick
            - scene_change
            - character_event
            - projection_checkpoint
        resourceRef:
          type: string
          description: >-
            Same-origin public path the client should re-`GET`, e.g.
            `/api/v2/world` or `/api/v2/characters/{id}/close-up`. Never a
            source of truth by itself.
          minLength: 1
          maxLength: 200
        checkpointCursor:
          type: string
          description: >-
            Reconnect cursor; resend as `Last-Event-ID` (or the SSE `id:`
            field carries the same value) to resume from this checkpoint.
          minLength: 1
          maxLength: 512
        visibilityEpoch:
          $ref: '#/components/schemas/Version'
        serverNow:
          type: string
          format: date-time
