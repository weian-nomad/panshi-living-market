    PaperAccountPublicSummary:
      type: object
      description: >-
        Public projection of `PaperAccount` authoritative fields only —
        never order lifecycle, fill state, lots, or position P&L
        (system-design.md §9.1).
      additionalProperties: false
      required:
        - currency
        - cashMinorUnits
        - reservedCashMinorUnits
        - initialCapitalMinorUnits
        - correctionRefs
        - asOf
      properties:
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        cashMinorUnits:
          type: integer
        reservedCashMinorUnits:
          type: integer
        initialCapitalMinorUnits:
          type: integer
          description: Baseline virtual principal (e.g. NT$1,000,000; system-design.md §9.1).
        correctionRefs:
          type: array
          items:
            $ref: '#/components/schemas/Uuid'
        asOf:
          type: string
          format: date-time
    PaperLotPublic:
      type: object
      additionalProperties: false
      required:
        - lotId
        - quantityFixed6
        - sealedPriceMinorUnitsFixed6
        - costBasisMinorUnits
        - sealedPriceRevisionRef
      properties:
        lotId:
          $ref: '#/components/schemas/Uuid'
        quantityFixed6:
          type: integer
          description: Quantity scaled by 1,000,000 (integer fixed-point; never float).
        sealedPriceMinorUnitsFixed6:
          type: integer
          description: >-
            Per-unit sealed reference price in currency minor units,
            further scaled by 1,000,000 for sub-minor-unit precision.
        costBasisMinorUnits:
          type: integer
          description: Total lot cost basis in currency minor units.
        sealedPriceRevisionRef:
          $ref: '#/components/schemas/Digest'
    PaperPositionPublic:
      type: object
      additionalProperties: false
      required:
        - positionId
        - instrumentLabel
        - status
        - openedAt
        - lastChangedAt
        - closedAt
        - lots
        - realizedPnlMinorUnits
        - unrealizedPnlMinorUnits
        - unrealizedPnlPercentFixed2
        - markAsOf
        - invalidationCondition
        - rationaleSummary
        - influencedByCharacterRefs
        - consequenceSummary
      properties:
        positionId:
          $ref: '#/components/schemas/Uuid'
        instrumentLabel:
          type: string
          description: Company name/ticker label only — never a recommendation badge.
          minLength: 1
          maxLength: 80
        status:
          $ref: '#/components/schemas/PaperPositionStatus'
        openedAt:
          type: string
          format: date-time
        lastChangedAt:
          type: string
          format: date-time
        closedAt:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        lots:
          type: array
          items:
            $ref: '#/components/schemas/PaperLotPublic'
        realizedPnlMinorUnits:
          oneOf:
            - type: integer
            - type: 'null'
        unrealizedPnlMinorUnits:
          oneOf:
            - type: integer
            - type: 'null'
        unrealizedPnlPercentFixed2:
          oneOf:
            - type: integer
            - type: 'null'
        markAsOf:
          type: string
          format: date-time
        invalidationCondition:
          $ref: '#/components/schemas/InvalidationCondition'
        rationaleSummary:
          type: string
          description: Unquoted structured summary sealed at the time, never a quote.
          minLength: 1
          maxLength: 400
        concurrentClaim:
          description: "同時原話 — present only if a visible UtteranceArtifactV1 exists."
          $ref: '#/components/schemas/CharacterUtterance'
        currentNarration:
          $ref: '#/components/schemas/CharacterNarrationOrSummary'
        influencedByCharacterRefs:
          type: array
          items:
            $ref: '#/components/schemas/Uuid'
        consequenceSummary:
          type: string
          minLength: 1
          maxLength: 300
    PaperDailyActionDisclosure:
      type: object
      description: >-
        Same-day ticker-specific action, direction, quantity, confidence,
        and fill. This object is structurally absent from
        `PaperActionFillRecord` until `MarketSessionFinalityAccepted` is
        recorded for that trading day — never present with nulled fields
        (market-safety.md "當期交易時段不得公開" / "盤後才可公開").
      additionalProperties: false
      required:
        - instrumentLabel
        - action
        - direction
        - quantityFixed6
        - confidencePercentFixed2
        - fill
        - rationaleSummary
      properties:
        instrumentLabel:
          type: string
          minLength: 1
          maxLength: 80
        action:
          $ref: '#/components/schemas/PaperActionKind'
        direction:
          $ref: '#/components/schemas/PaperDirection'
        quantityFixed6:
          type: integer
          description: Quantity scaled by 1,000,000.
        confidencePercentFixed2:
          type: integer
          description: Signed percentage scaled by 100 (2 implied decimal places).
        fill:
          description: "`null` when the order expired unfilled (`PaperOrderExpired`)."
          oneOf:
            - type: object
              additionalProperties: false
              required: [sealedPriceMinorUnitsFixed6, sealedPriceRevisionRef, filledAt]
              properties:
                sealedPriceMinorUnitsFixed6:
                  type: integer
                sealedPriceRevisionRef:
                  $ref: '#/components/schemas/Digest'
                filledAt:
                  type: string
                  format: date-time
            - type: 'null'
        rationaleSummary:
          type: string
          description: Unquoted structured summary sealed before action, never a quote.
          minLength: 1
          maxLength: 400
        concurrentClaim:
          $ref: '#/components/schemas/CharacterUtterance'
    PaperActionFillRecord:
      type: object
      description: >-
        `dailyActionDisclosure` is an optional key that is only ever
        serialized once `marketSessionFinalityState` is `accepted` for
        this record's `tradingDate`; pre-finality responses omit the key
        entirely rather than sending it nulled out.
      additionalProperties: false
      required:
        - recordId
        - positionRef
        - tradingDate
        - marketSessionFinalityState
        - recordDataState
      properties:
        recordId:
          $ref: '#/components/schemas/Uuid'
        positionRef:
          $ref: '#/components/schemas/Uuid'
        tradingDate:
          type: string
          format: date
          description: Asia/Taipei trading session date.
        marketSessionFinalityState:
          $ref: '#/components/schemas/MarketSessionFinalityState'
        recordDataState:
          $ref: '#/components/schemas/DataState'
        dailyActionDisclosure:
          $ref: '#/components/schemas/PaperDailyActionDisclosure'
    DataRevisionNote:
      type: object
      additionalProperties: false
      required: [revisionId, appliedAt, kind, affectedRefs, summary]
      properties:
        revisionId:
          type: string
          minLength: 1
          maxLength: 128
        appliedAt:
          type: string
          format: date-time
        kind:
          $ref: '#/components/schemas/DataRevisionKind'
        affectedRefs:
          type: array
          items:
            $ref: '#/components/schemas/Uuid'
        summary:
          type: string
          minLength: 1
          maxLength: 300
    PaperArchiveProjection:
      type: object
      additionalProperties: false
      required:
        - projectionVersion
        - sourceGlobalPosition
        - serverNow
        - dataState
        - visibilityEpoch
        - truthClasses
        - sourceRevisionSet
        - characterId
        - appliedAudienceScope
        - asOf
        - paperVersionSet
        - account
        - positions
        - historicalActionFills
        - dataRevisions
      properties:
        projectionVersion:
          $ref: '#/components/schemas/Version'
        sourceGlobalPosition:
          $ref: '#/components/schemas/Version'
        serverNow:
          type: string
          format: date-time
        dataState:
          $ref: '#/components/schemas/DataState'
        visibilityEpoch:
          $ref: '#/components/schemas/Version'
        truthClasses:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/TruthClass'
        sourceRevisionSet:
          type: array
          items:
            $ref: '#/components/schemas/SourceRevisionRef'
        characterId:
          $ref: '#/components/schemas/Uuid'
        appliedAudienceScope:
          $ref: '#/components/schemas/AudienceScope'
        asOf:
          type: string
          format: date-time
          description: >-
            Explicit as-of for the whole projection; intraday this is
            always the previous trading session's close
            (experience-spec §7.2, §9.4).
        paperVersionSet:
          $ref: '#/components/schemas/PaperVersionSet'
        account:
          $ref: '#/components/schemas/PaperAccountPublicSummary'
        positions:
          type: array
          items:
            $ref: '#/components/schemas/PaperPositionPublic'
        historicalActionFills:
          type: array
          items:
            $ref: '#/components/schemas/PaperActionFillRecord'
        dataRevisions:
          type: array
          items:
            $ref: '#/components/schemas/DataRevisionNote'
    CharacterPaperArchiveResponse:
      oneOf:
        - $ref: '#/components/schemas/PaperArchiveProjection'
        - $ref: '#/components/schemas/WithdrawnCharacterProjection'
    WorldStreamEventEnvelope:
      type: object
      description: >-
        The JSON shape carried in each SSE frame's `data:` field for
        `GET /events/v2/world`. This only signals "resource changed" —
        never authoritative content; clients must re-`GET` `resourceRef`.
      additionalProperties: false
      required: [eventKind, resourceRef, checkpointCursor, visibilityEpoch, serverNow]
      properties:
        eventKind:
          type: string
          enum:
            - world_tick
            - scene_change
            - character_event
            - projection_checkpoint
        resourceRef:
          type: string
          description: >-
            Same-origin public path the client should re-`GET`, e.g.
            `/api/v2/world` or `/api/v2/characters/{id}/close-up`. Never a
            source of truth by itself.
          minLength: 1
          maxLength: 200
        checkpointCursor:
          type: string
          description: >-
            Reconnect cursor; resend as `Last-Event-ID` (or the SSE `id:`
            field carries the same value) to resume from this checkpoint.
          minLength: 1
          maxLength: 512
        visibilityEpoch:
          $ref: '#/components/schemas/Version'
        serverNow:
          type: string
          format: date-time
