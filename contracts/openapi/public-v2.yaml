          $ref: '#/components/schemas/Uuid'
        truthClass:
          $ref: '#/components/schemas/TruthClass'
        sourceRefs:
          $ref: '#/components/schemas/ArchiveSourceRefs'
    EvidenceCard:
      type: object
      description: >-
        The typed consequence card of one chapter, built from canonical
