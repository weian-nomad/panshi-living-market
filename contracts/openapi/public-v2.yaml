      required:
        - sectionKey
        - viewerAudienceScope
        - summary
        - asOf
        - visibilityEpoch
        - sectionPath
      properties:
        sectionKey:
          $ref: '#/components/schemas/ArchiveSectionKey'
        viewerAudienceScope:
          description: >-
            The audience scope actually applied for the requesting viewer
            on this section (system-design.md §11.3 audience table).
