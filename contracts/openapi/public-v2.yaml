          format: date-time
        visibilityEpoch:
          $ref: '#/components/schemas/Version'
        sectionPath:
          description: >-
            Same-origin path for this section's dedicated endpoint. Every
            `ArchiveSectionKey` has one, so this is non-null for all six
            sections; `null` stays in the type only so a future section
            key can be indexed before its page exists without a breaking
