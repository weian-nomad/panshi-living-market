openapi: 3.1.0
info:
  title: Panshi Living Market Public API (V5)
  version: 2.0.0
  description: |
    V5 (《盤勢・眾生》) public read-side API surface, scoped to the Phase 2
    one-character vertical slice described in `docs/v5/system-design.md`
    §11.3 and `docs/v5/experience-spec.md` §13. This file is a deliberate
    subset of the full V5 route set that exists on paper in those documents;
    it does not attempt to cover the entire V5 surface yet.

    - Canonical public origin: `https://panshi.app` (apex only; `www`
      redirects to apex with a 308). Every route in this file is a
      same-origin `/api/v2/*` (or `/events/v2/*`) path served behind the
      edge gateway described in `system-design.md` §3.1. The web client
      never calls a different origin for these resources.
    - This file coexists with, and never replaces or extends,
      `contracts/openapi/public-v1.yaml` (the historical five-seat `/v1/*`
      game contract). `/api/v2/*` is an entirely separate surface with its
      own major version.
    - Explicitly out of scope for this file/phase (see `system-design.md`
      §11.3 for the full V5 read-API table): introductions
      (`POST /api/v2/introductions`, `GET /api/v2/introductions`),
      scene-seeds (`/api/v2/scene-seeds`), entitlement
      (`GET /api/v2/me/entitlement`), moments/story-chapters
      (`GET /api/v2/moments`, `GET /api/v2/story-chapters/{id}`), viewer
      library (`GET /api/v2/me/library`, follows, reminders, clips,
      story-rolls), and search (`GET /api/v2/search`).
    - Also not yet built here (same §11.3 table, later phases): model-core
      catalog, price catalog, market-fact lookup, utterance audio
      renditions, account settings/export/delete, and generic command
      status. All six deep-archive sections are built: the index plus
      `archive/paper`, `archive/relations`, `archive/chart`,
      `archive/traits`, `archive/memories` and `archive/life`.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: https://panshi.app
    description: Canonical public origin; same-origin /api/v2/* and /events/v2/*.
security:
  - {}
  - bearerAuth: []
tags:
  - name: World
    description: Public world snapshot and the realtime world event stream.
  - name: Characters
    description: >-
      Per-character public read projections: close-up, life journal, and
      deep archive.
  - name: Realtime
    description: >-
      Server-sent event streams that signal projection changes only; never
      an authoritative payload.
paths:
  /api/v2/world:
    get:
      summary: Get the public world snapshot
      description: >-
        Scene, character positions, market clock, story hooks, and data
        state for the persistent public world. See
        `docs/v5/experience-spec.md` §5 and `docs/v5/system-design.md` §7.
      operationId: getWorldSnapshot
      tags: [World]
      responses:
        '200':
          description: Current public world snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorldSnapshot'
        '404':
          description: No published world snapshot exists yet.
          $ref: '#/components/responses/NotFound'
  /api/v2/characters/{id}/close-up:
    parameters:
      - $ref: '#/components/parameters/CharacterId'
    get:
      summary: Get a character's public close-up
      description: >-
        Current observable state, current attention, public claims, and
        unresolved commitments for one character. See
        `docs/v5/experience-spec.md` §7. Always resolved at the
        `public_current` audience scope; it does not vary by entitlement.
      operationId: getCharacterCloseUp
      tags: [Characters]
      responses:
        '200':
          description: >-
            Character close-up, or a tombstone projection if the character
            has been withdrawn.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharacterCloseUpResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v2/characters/{id}/life-journal:
    parameters:
      - $ref: '#/components/parameters/CharacterId'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
    get:
      summary: Get one page of a character's canonical life journal
      description: >-
        Cursor-based canonical chronological chapters. Each entry carries
        only in-chapter consequence summaries and `/archive/*` refs — never
        the full life curve, ledger, relationship graph, or memory index.
        See `docs/v5/experience-spec.md` §8 and
        `docs/v5/system-design.md` §11.3's audience table.
      operationId: getCharacterLifeJournal
      tags: [Characters]
      responses:
        '200':
          description: >-
            One page of life-journal entries, or a tombstone projection if
            the character has been withdrawn.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharacterLifeJournalResponse'
        '400':
          description: Malformed or expired cursor.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v2/characters/{id}/archive:
    parameters:
      - $ref: '#/components/parameters/CharacterId'
    get:
      summary: Get a character's deep-archive index
      description: >-
        Deep-archive index and per-section entitlement/as-of/visibility.
        Section payloads are never inlined here — each section's full
        content is served by its own dedicated endpoint, and every
        section's `sectionPath` points at it. See
        `docs/v5/experience-spec.md` §9.1.
      operationId: getCharacterArchiveIndex
      tags: [Characters]
      responses:
        '200':
          description: >-
            Deep-archive index, or a tombstone projection if the character
            has been withdrawn.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharacterArchiveIndexResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v2/characters/{id}/archive/paper:
    parameters:
      - $ref: '#/components/parameters/CharacterId'
    get:
      summary: Get a character's public paper-trading archive
      description: >-
        Paper account summary, orders/positions/lots, realized and
        unrealized P&L, historical action/fill records, the three-aggregate
        exact version set, `asOf`, and data revisions — restricted to
        whatever has already passed the public market-time fence. Same-day
        ticker-specific action, direction, quantity, confidence, and fill
        are structurally absent from every `historicalActionFills[].
        dailyActionDisclosure` until `MarketSessionFinalityAccepted` is
        recorded for that trading day; see
        `docs/v5/market-safety.md` ("盤中與盤後揭露") and
        `docs/v5/system-design.md` §9 and §11.2–§11.3.
      operationId: getCharacterPaperArchive
      tags: [Characters]
      responses:
        '200':
          description: >-
            Public paper-trading archive projection, or a tombstone
            projection if the character has been withdrawn.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharacterPaperArchiveResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v2/characters/{id}/archive/relations:
    parameters:
      - $ref: '#/components/parameters/CharacterId'
    get:
      summary: Get a character's relations archive section
      description: >-
        Acquaintance nodes by display name and relationship label (never a
        raw acquaintance key), his one-way observable interactions with
        each, the relationship signals his own sealed public claims left
        behind (quoting the claim's `UtteranceArtifactV1` verbatim), and an
        explicit `unknown` for the counterpart's side when she has no sealed
        utterance. No affection score. See `docs/v5/experience-spec.md`
        §9.5.
      operationId: getCharacterRelationsArchive
      tags: [Characters]
      responses:
        '200':
          description: >-
            Relations section, or a tombstone projection if the character
            has been withdrawn.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharacterRelationsArchiveResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v2/characters/{id}/archive/chart:
    parameters:
      - $ref: '#/components/parameters/CharacterId'
    get:
      summary: Get a character's natal-chart archive section
      description: >-
        The fictional birth identity, the sealed symbolic motif with its
        active window and the chapters whose sealed symbolic segment invoked
        it. Every motif item is `symbolic_interpretation` and states that it
        only affects attention and interpretation, never price or paper
        performance. Placements not computed from sealed birth data are a
        typed empty list with a reason. See `docs/v5/experience-spec.md`
        §9.6.
      operationId: getCharacterChartArchive
      tags: [Characters]
      responses:
        '200':
          description: >-
            Chart section, or a tombstone projection if the character has
            been withdrawn.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharacterChartArchiveResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v2/characters/{id}/archive/traits:
    parameters:
      - $ref: '#/components/parameters/CharacterId'
    get:
      summary: Get a character's traits-and-habits archive section
      description: >-
        Continuous four-axis preferences, core need and fear, blood type
        (social tone only), habits with the sessions that show them, and
        every fallible pattern listed once per sealed occurrence beside its
        evidence sessions, plus the sessions that contradict it. No score,
        total, count or ranking is carried. See
        `docs/v5/experience-spec.md` §9.7.
      operationId: getCharacterTraitsArchive
      tags: [Characters]
      responses:
        '200':
          description: >-
            Traits section, or a tombstone projection if the character has
            been withdrawn.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharacterTraitsArchiveResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v2/characters/{id}/archive/memories:
    parameters:
      - $ref: '#/components/parameters/CharacterId'
    get:
      summary: Get a character's memories archive section
      description: >-
        Sealed `MemoryFormed` records whose visibility is
        `subscriber_archive` or `public_edition`, each with its source
        events. `canonical_restricted` memories are never listed, not even
        as a count. See `docs/v5/experience-spec.md` §9.8.
      operationId: getCharacterMemoriesArchive
      tags: [Characters]
      responses:
        '200':
          description: >-
            Memories section, or a tombstone projection if the character has
            been withdrawn.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharacterMemoriesArchiveResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v2/characters/{id}/archive/life:
    parameters:
      - $ref: '#/components/parameters/CharacterId'
    get:
      summary: Get a character's life archive section
      description: >-
        The fictional adult's identity and synthetic birthplace, fictional
        life milestones, the origin memories he arrived with, the life
        facets the chassis never sealed (listed as unrecorded, not written),
        and a pointer per market session into the canonical chapter
        timeline. See `docs/v5/experience-spec.md` §9.9.
      operationId: getCharacterLifeArchive
      tags: [Characters]
      responses:
        '200':
          description: >-
            Life section, or a tombstone projection if the character has
            been withdrawn.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharacterLifeArchiveResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /events/v2/world:
    get:
      summary: Subscribe to the public world event stream (SSE)
      description: |
        Server-sent event stream for world ticks, scene changes, publicly
        visible character events, and projection checkpoints. OpenAPI 3.1
        cannot fully express a multiplexed SSE stream; this path item
        documents the message shape and semantics rather than a literal
        single request/response exchange. The `text/event-stream` schema
        below describes the JSON payload carried in each frame's `data:`
        field.

        Edge mapping: the public path `/events/v2/world` is mapped by the
        edge gateway to the internal SSE router path `/v2/world/stream`
        (see `docs/v5/system-design.md` §11.3). That internal path is never
        part of the public contract: it must not appear in the generated
        TypeScript client, in any error payload, or in any share URL. It is
        named here only as an architecture note for engineers reading this
        file, exactly as `system-design.md` itself documents the mapping.

        Truth semantics: every frame only signals "resource changed" via
        `eventKind` and `resourceRef`. Clients must treat the SSE payload
        as a hint, never as truth — after receiving a frame, re-`GET` the
        referenced public projection endpoint (for example
        `GET /api/v2/world` or `GET /api/v2/characters/{id}/close-up`)
        before rendering anything. Clients must not derive dialogue,
        position, holdings, or market state from a timer or from the SSE
        payload itself (`docs/v5/system-design.md` §11.4).

        Reconnect: send the last received `checkpointCursor` as the
        `Last-Event-ID` header (or the SSE `id:` field, which carries the
        same cursor) when reconnecting. The stream resumes by replaying
        checkpoints from that cursor forward; it does not replay from the
        beginning of world time.
      operationId: streamWorldEvents
      tags: [Realtime]
      parameters:
        - $ref: '#/components/parameters/LastEventId'
      responses:
        '200':
          description: >-
            Open SSE stream. Each frame's `data:` payload is one
            `WorldStreamEventEnvelope`.
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/WorldStreamEventEnvelope'
        '400':
          description: Malformed or expired `Last-Event-ID` reconnect cursor.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    CharacterId:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 512
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    LastEventId:
      name: Last-Event-ID
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 512
  responses:
    NotFound:
      description: Unknown or inaccessible resource.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Uuid:
      type: string
      format: uuid
    Version:
      type: integer
      format: int64
      minimum: 0
    Digest:
      type: string
      description: Lowercase hex-encoded SHA-256 digest.
      pattern: '^[a-f0-9]{64}$'
    TruthClass:
      type: string
      enum:
        - real_fact
        - statistical_sample
        - fictional_setting
        - symbolic_interpretation
        - simulated_narrative
    DataState:
      type: string
      description: >-
        Cross-cutting projection freshness/availability state (see
        `docs/v5/system-design.md` §11.3).
      enum:
        - READY
        - STALE
        - HELD
        - CORRECTED
        - WITHDRAWN
    AudienceScope:
      type: string
      description: >-
        Versioned audience contract from `docs/v5/system-design.md` §11.3.
        `canonical_restricted` is never the applied scope of a successful
        response body — it means the resource cannot be queried at all.
      enum:
        - public_current
        - free_archive
        - subscriber_archive
        - canonical_restricted
    MarketSessionPhase:
      type: string
      description: >-
        Public-world time-of-day segment from
        `docs/v5/experience-spec.md` §5.3.
      enum:
        - pre_market
        - in_session
        - after_session
        - night
        - non_trading_day
    CharacterPoseState:
      type: string
      description: >-
        Neutral, non-market-signaling posture. See
        `docs/v5/market-safety.md` ("盤中可公開") for why these are
        deliberately neutral rather than transaction-shaped.
      enum:
        - idle
        - walking
        - talking
        - examining
        - interrupted
        - avoiding
        - silent
    SceneLayer:
      type: string
      description: Foreground/midground/background activity layer (experience-spec §5.1).
      enum:
        - foreground
        - midground
        - background
    DetailTier:
      type: string
      description: Rendering level of detail budget (experience-spec §5.1).
      enum:
        - high_detail
        - edge_silhouette
    ArchiveSectionKey:
      type: string
      description: >-
        The fixed set of deep-archive sections from
        `docs/v5/system-design.md` §11.3, in index order. Every section has
        its own dedicated endpoint at `/api/v2/characters/{id}/archive/{key}`
        (`paper`, `relations`, `chart`, `traits`, `memories`, `life`), and
        each section item there carries a `truthClass` and non-empty
        `sourceRefs`.
      enum:
        - paper
        - relations
        - chart
        - traits
        - memories
        - life
    V2ReasonCode:
      type: string
      enum:
        - UNKNOWN_RESOURCE
        - VISIBILITY_HELD
        - WITHDRAWN
        - RIGHTS_REVOKED
        - PROJECTION_LAGGING
        - CANONICAL_RESTRICTED
        - MALFORMED_CURSOR
    PaperPositionStatus:
      type: string
      enum:
        - open
        - closed
        - pending
    PaperActionKind:
      type: string
      description: Canonical paper-intent action set (system-design.md §9.2).
      enum:
        - BUY
        - SELL
        - HOLD
        - NO_ACTION
    PaperDirection:
      type: string
      enum:
        - no_action
        - upside
        - downside
    InvalidationCondition:
      type: string
      enum:
        - not_yet_occurred
        - occurred
        - unknown_at_the_time
    MarketSessionFinalityState:
      type: string
      description: Whether `MarketSessionFinalityAccepted` has landed for a trading day.
      enum:
        - pending
        - accepted
    DataRevisionKind:
      type: string
      enum:
        - fact_correction
        - accounting_correction
        - position_adjustment
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, reasonCode, traceId]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        reasonCode:
          $ref: '#/components/schemas/V2ReasonCode'
        traceId:
          type: string
          minLength: 16
          maxLength: 64
    SourceRevisionRef:
      type: object
      description: >-
        One canonical aggregate/fact ref and the exact revision this
        projection was computed from. Part of the generic
        `sourceRevisionSet` required on every projection response; see
        `PaperVersionSet` for the fully-typed triple-aggregate version set
        used specifically by `/archive/paper`.
      additionalProperties: false
      required: [refId, refKind, revision]
      properties:
        refId:
          type: string
          minLength: 1
          maxLength: 128
        refKind:
          type: string
          minLength: 1
          maxLength: 64
        revision:
          $ref: '#/components/schemas/Version'
    PaperVersionSet:
      type: object
      description: >-
        The three-aggregate exact version set from
        `docs/v5/system-design.md` §9.1. `paperOrderRefs`/
        `paperOrderVersions` and `paperPositionRefs`/`paperPositionVersions`
        are parallel arrays of equal length, pairwise ordered by stable
        aggregate ID byte order, with no duplicates. Any input or
        projection that only carries `paperAccountVersion` without the
        order/position arrays is not a valid version set.
      additionalProperties: false
      required:
        - paperAccountRef
        - paperAccountVersion
        - paperOrderRefs
        - paperOrderVersions
        - paperPositionRefs
        - paperPositionVersions
        - paperVersionSetDigest
      properties:
        paperAccountRef:
          $ref: '#/components/schemas/Uuid'
        paperAccountVersion:
          $ref: '#/components/schemas/Version'
        paperOrderRefs:
          type: array
          items:
            $ref: '#/components/schemas/Uuid'
        paperOrderVersions:
          type: array
          items:
            $ref: '#/components/schemas/Version'
        paperPositionRefs:
          type: array
          items:
            $ref: '#/components/schemas/Uuid'
        paperPositionVersions:
          type: array
          items:
            $ref: '#/components/schemas/Version'
        paperVersionSetDigest:
          $ref: '#/components/schemas/Digest'
    CharacterUtterance:
      type: object
      description: >-
        An immutable, server-resolved `UtteranceArtifactV1` reference plus
        its verbatim canonical bytes. Never paired with a second freeform
        "summary of what they said" string field (system-design.md §11.1,
        §11.4).
      additionalProperties: false
      required: [utteranceArtifactId, canonicalTextSha256, canonicalTextUtf8]
      properties:
        utteranceArtifactId:
          type: string
          minLength: 1
          maxLength: 128
        canonicalTextSha256:
          $ref: '#/components/schemas/Digest'
        canonicalTextUtf8:
          type: string
          minLength: 1
    CharacterNarrationOrSummary:
      description: >-
        A later self-narration that is either a verbatim, artifact-backed
        quote (when a visible `UtteranceArtifactV1` exists) or an
        unquoted structured summary (the documented fallback shape from
        `docs/v5/experience-spec.md` §8.4 — never both, and never a
        system-authored quote).
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind, utteranceArtifactId, canonicalTextSha256, canonicalTextUtf8]
          properties:
            kind:
              type: string
              const: utterance
            utteranceArtifactId:
              type: string
              minLength: 1
              maxLength: 128
            canonicalTextSha256:
              $ref: '#/components/schemas/Digest'
            canonicalTextUtf8:
              type: string
              minLength: 1
        - type: object
          additionalProperties: false
          required: [kind, summaryText]
          properties:
            kind:
              type: string
              const: summary
            summaryText:
              type: string
              minLength: 1
    WithdrawnCharacterProjection:
      type: object
      description: >-
        Stable-deep-link tombstone projection returned in place of a full
        character projection once `CharacterContinuityClassChanged` has
        moved a character to `WITHDRAWN` (system-design.md §3.1, §7.2.1).
        Existing public URLs never silently point at a different character
        or a different story.
      additionalProperties: false
      required:
        - projectionVersion
        - sourceGlobalPosition
        - serverNow
        - dataState
        - visibilityEpoch
        - truthClasses
        - sourceRevisionSet
        - characterId
        - tombstoneReasonLabel
      properties:
        projectionVersion:
          $ref: '#/components/schemas/Version'
        sourceGlobalPosition:
          $ref: '#/components/schemas/Version'
        serverNow:
          type: string
          format: date-time
        dataState:
          type: string
          const: WITHDRAWN
        visibilityEpoch:
          $ref: '#/components/schemas/Version'
        truthClasses:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/TruthClass'
        sourceRevisionSet:
          type: array
          items:
            $ref: '#/components/schemas/SourceRevisionRef'
        characterId:
          $ref: '#/components/schemas/Uuid'
        tombstoneReasonLabel:
          type: string
          description: >-
            Policy-safe, non-diagnostic label. Never includes
            `canonical_restricted` audit detail.
          minLength: 1
          maxLength: 160
    AttentionTarget:
      type: object
      additionalProperties: false
      required: [targetKind, label]
      properties:
        targetKind:
          type: string
          enum: [person, object, event, unknown]
        label:
          type: string
          minLength: 1
          maxLength: 120
    UnresolvedCommitment:
      type: object
      additionalProperties: false
      required: [commitmentId, rationaleSummary, sealedAt, stillOpen]
      properties:
        commitmentId:
          $ref: '#/components/schemas/Uuid'
        rationaleSummary:
          type: string
          description: Unquoted structured summary, never a system-authored quote.
          minLength: 1
          maxLength: 400
        sealedAt:
          type: string
          format: date-time
        stillOpen:
          type: boolean
    PaperPositionConsequenceHighlight:
      type: object
      additionalProperties: false
      required: [kind, positionArchiveRef, unrealizedPnlPercentFixed2, asOf]
      properties:
        kind:
          type: string
          const: paper_position
        positionArchiveRef:
          $ref: '#/components/schemas/Uuid'
        unrealizedPnlPercentFixed2:
          type: integer
          description: >-
            Signed percentage scaled by 100 (2 implied decimal places);
            e.g. -840 represents -8.40%.
        asOf:
          type: string
          format: date-time
          description: >-
            Always shown next to any paper figure (experience-spec §7.2);
            during a trading session this is the previous session's close.
    RelationshipConsequenceHighlight:
      type: object
      additionalProperties: false
      required: [kind, dyadArchiveRef, summary]
      properties:
        kind:
          type: string
          const: relationship
        dyadArchiveRef:
          $ref: '#/components/schemas/Uuid'
        summary:
          type: string
          minLength: 1
          maxLength: 200
    OccupationConsequenceHighlight:
      type: object
      additionalProperties: false
      required: [kind, summary]
      properties:
        kind:
          type: string
          const: occupation
