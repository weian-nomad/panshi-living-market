    LifeJournalConsequence:
      type: object
      description: >-
        "這個決定留下什麼" — present only when it answers a real character
        consequence; never a forced-empty performance figure
        (experience-spec §7.2, §8.4).
      additionalProperties: false
      properties:
        paperConsequence:
          $ref: '#/components/schemas/PaperConsequenceFragment'
        nonPaperConsequenceSummary:
          type: string
          minLength: 1
          maxLength: 300
      anyOf:
        - required: [paperConsequence]
        - required: [nonPaperConsequenceSummary]
    LifeJournalArchiveRefs:
      type: object
      description: >-
        Only refs into `/archive/*` sections — never the full ledger,
        relationship graph, or memory index inline (system-design.md
        §11.3).
      additionalProperties: false
      required: [paperPositionRefs, relationshipDyadRefs, memoryRefs]
      properties:
        paperPositionRefs:
          type: array
          items:
            $ref: '#/components/schemas/Uuid'
        relationshipDyadRefs:
          type: array
          items:
            $ref: '#/components/schemas/Uuid'
        memoryRefs:
          type: array
          items:
            $ref: '#/components/schemas/Uuid'
    LifeJournalEntry:
      type: object
      description: >-
        One published canonical day-chapter, ordered per experience-spec
        §8.1. A withheld chapter is never an entry here: it is listed in
        `LifeJournalPage.heldEntries` as a `HeldLifeJournalEntry`.
      additionalProperties: false
      required:
        - entryId
        - chapterDate
        - entryVisibility
        - narrativeState
        - narrativeSegments
        - sceneSummary
        - knownAtTheTimeSummary
        - actionSummary
        - consequence
        - evidenceCard
        - relationshipConsequence
        - relationshipConsequenceNullReason
        - openQuestionSummary
        - archiveRefs
      properties:
        entryId:
          $ref: '#/components/schemas/Uuid'
        chapterDate:
          type: string
          format: date
        entryVisibility:
          type: string
          description: >-
            Always `PUBLIC` on an entry; `HELD` chapters carry only a label
            and live in `heldEntries`.
          const: PUBLIC
        narrativeState:
          type: string
          description: >-
            `composed` when the chapter's sealed narrative is available;
            `evidence_card_only` when it is not — then
            `narrativeSegments` is empty, `sceneSummary` is a fixed system
            label, and `evidenceCard` still carries the whole consequence.
          enum: [composed, evidence_card_only]
        narrativeSegments:
          type: array
          items:
            $ref: '#/components/schemas/NarrativeSegment'
        evidenceCard:
          $ref: '#/components/schemas/EvidenceCard'
        relationshipConsequence:
          description: >-
            The chapter's readable relationship consequence, from its
            `RelationshipSignalObserved`; `null` when there is none.
          oneOf:
            - $ref: '#/components/schemas/RelationshipSignalView'
            - type: 'null'
        relationshipConsequenceNullReason:
          description: Non-null exactly when `relationshipConsequence` is `null`.
          oneOf:
            - type: string
              minLength: 1
              maxLength: 200
            - type: 'null'
        sceneSummary:
          type: string
          description: >-
            "今天他怎麼了" — the chapter's sealed observable segment; with
            `narrativeState: evidence_card_only`, a fixed system label that
            makes no claim about him.
          minLength: 1
          maxLength: 300
        contemporaneousClaim:
          description: "他當時怎麼說 — original self-statement, never rewritten after the fact; absent if nothing was said."
          $ref: '#/components/schemas/CharacterUtterance'
        knownAtTheTimeSummary:
          type: string
          description: "他其實知道什麼 — only material the character had actually encountered by then."
          minLength: 1
          maxLength: 400
        missedFactsSummary:
          type: string
          description: "他漏掉了什麼 — only revealed after close or after the relevant data went public."
          minLength: 1
          maxLength: 400
        actionSummary:
          type: string
          description: "他做了什麼 — structured summary of the paper action, wait, ask-for-help, concealment, or withdrawal."
          minLength: 1
          maxLength: 300
        consequence:
          $ref: '#/components/schemas/LifeJournalConsequence'
        currentSelfNarration:
          $ref: '#/components/schemas/CharacterNarrationOrSummary'
        recurringPatternRef:
          description: "老毛病又回來了 — present only once the same pattern has recurred at least twice."
          $ref: '#/components/schemas/Uuid'
        openQuestionSummary:
          type: string
          description: "還沒完 — the next unresolved question; never previews the outcome."
          minLength: 1
          maxLength: 200
        archiveRefs:
          $ref: '#/components/schemas/LifeJournalArchiveRefs'
    LifeJournalPage:
      type: object
      additionalProperties: false
      required:
