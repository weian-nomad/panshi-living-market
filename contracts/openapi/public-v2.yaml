          $ref: '#/components/schemas/AudienceScope'
        asOf:
          type: string
          format: date-time
          description: >-
            Explicit as-of for the whole projection; intraday this is
            always the previous trading session's close
            (experience-spec §7.2, §9.4).
        paperVersionSet:
          $ref: '#/components/schemas/PaperVersionSet'
        account:
          $ref: '#/components/schemas/PaperAccountPublicSummary'
        positions:
          type: array
          items:
            $ref: '#/components/schemas/PaperPositionPublic'
        historicalActionFills:
          type: array
          items:
            $ref: '#/components/schemas/PaperActionFillRecord'
        dataRevisions:
          type: array
          items:
            $ref: '#/components/schemas/DataRevisionNote'
    CharacterPaperArchiveResponse:
      oneOf:
        - $ref: '#/components/schemas/PaperArchiveProjection'
        - $ref: '#/components/schemas/WithdrawnCharacterProjection'
    ArchiveSourceRef:
      type: object
      description: >-
        Where one archive or evidence item came from: a canonical event (by
        event type and 1-based global log position — the coordinate
        `sourceGlobalPosition` counts in — plus the stream it was appended
        to), or a named anchor in the frozen character chassis for a value
        no canonical event carries. `eventType` and `globalPosition` are
        non-null exactly when `kind` is `canonical_event`.
      additionalProperties: false
      required: [kind, eventType, globalPosition, refId]
      properties:
        kind:
          type: string
          enum: [canonical_event, character_seed]
        eventType:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 64
            - type: 'null'
        globalPosition:
          oneOf:
            - $ref: '#/components/schemas/Version'
            - type: 'null'
        refId:
          type: string
          minLength: 1
          maxLength: 160
    ArchiveSourceRefs:
      type: array
      minItems: 1
      description: Never empty — an item with no source is not rendered.
      items:
        $ref: '#/components/schemas/ArchiveSourceRef'
    ArchiveSessionPointer:
      type: object
      description: One market session and the journal entry it published, if any.
      additionalProperties: false
      required: [sessionDate, journalEntryRef]
      properties:
        sessionDate:
          type: string
          format: date
        journalEntryRef:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
    ArchivePersonLabel:
      type: object
      description: >-
        A counterpart resolved to a display name and relationship label.
        The raw canonical acquaintance key is never shown to a viewer.
