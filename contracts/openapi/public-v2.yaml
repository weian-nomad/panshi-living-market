      required: [displayName, relationLabel]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 40
        relationLabel:
          type: string
          minLength: 1
          maxLength: 40
    NarrativeSegment:
      description: >-
        One segment of the chapter's sealed `StoryChapterComposed`, in
        sealed order. A claim segment carries the artifact's canonical bytes
        verbatim; a narrator segment is never first person.
      oneOf:
        - type: object
          additionalProperties: false
          required: [segmentId, kind, truthClass, text, sourceRefs]
          properties:
            segmentId:
              type: string
              minLength: 1
              maxLength: 64
            kind:
              type: string
              const: narrator
            truthClass:
              $ref: '#/components/schemas/TruthClass'
            text:
              type: string
              minLength: 1
              maxLength: 400
            sourceRefs:
              $ref: '#/components/schemas/ArchiveSourceRefs'
        - type: object
          additionalProperties: false
          required:
            - segmentId
            - kind
            - truthClass
            - utteranceArtifactId
            - canonicalTextSha256
            - canonicalTextUtf8
            - sourceRefs
          properties:
            segmentId:
              type: string
              minLength: 1
              maxLength: 64
            kind:
              type: string
              const: character_claim
            truthClass:
              $ref: '#/components/schemas/TruthClass'
            utteranceArtifactId:
              $ref: '#/components/schemas/Uuid'
            canonicalTextSha256:
              $ref: '#/components/schemas/Digest'
            canonicalTextUtf8:
              type: string
              minLength: 1
            sourceRefs:
              $ref: '#/components/schemas/ArchiveSourceRefs'
    EvidenceAction:
      type: object
      description: The committed intent, as a fixed label. It says what, never why.
      additionalProperties: false
      required: [kind, label, truthClass, sourceRefs]
      properties:
        kind:
          $ref: '#/components/schemas/PaperActionKind'
        label:
          type: string
          minLength: 1
          maxLength: 40
        truthClass:
          $ref: '#/components/schemas/TruthClass'
        sourceRefs:
          $ref: '#/components/schemas/ArchiveSourceRefs'
    EvidencePaperOutcome:
      type: object
      description: >-
        The session's paper consequence, from canonical ledger events only:
