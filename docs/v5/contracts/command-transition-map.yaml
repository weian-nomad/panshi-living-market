schema_version: panshi.command-transition-map/v1
status: architecture_baseline
as_of: "2026-07-23"

source_of_truth_note: >
  This artifact is additional to docs/v5/contracts/canonical-owner-map.yaml,
  which remains authoritative for aggregate/event ownership. This file adds the
  command layer: legal source states, idempotency scope, target aggregate and
  emitted canonical events per V5 command. Every name in every `emits` list is a
  canonical event that appears verbatim in canonical-owner-map.yaml's
  canonical_event_families; every `target_aggregate` is a name declared in that
  file's canonical_aggregates; every `owner_context` is a canonical_write_context
  bounded context. Required by IMPLEMENTATION-HANDOFF.md item 2 ("Establish V5
  contracts beside V1").

derivation_notes:
  - >
    Most of the 143 canonical events map 1:1 to an imperative, verb-first
    PascalCase command whose sole effect is that event. State-machine-heavy
    contexts derive legal_source_states from the explicit diagrams in
    system-design.md (§8.2 Introduction, §12.2 SceneSeed, §7.2.1 continuity,
    §6.3 fact ingest) and from the fixed cognition/action/utterance sequence in
    §8.4 and character-story-engine.md ("從事件到行為", "事件順序與重播").
  - >
    The ten named atomic multi-stream transactions in system-design.md §5.3
    (AdmitAuthoringCommand, SealCharacterOrigin, CommitAutonomousPaperAction,
    ApplyPaperFill, RecognizeOutcome, SealUtterance, SealSceneSeedArtifact,
    AcceptSceneSeed, PublishStoryChapter, BeginAccountDeletion) keep those exact
    names and emit their full prose-derived event set atomically. Two further
    within-context multi-event transactions are modelled per §8.2 because the
    spec co-commits their events in one transaction and inventing a standalone
    capacity-release command would be false precision:
    CancelIntroductionBeforeOrigin and FailIntroduction.
  - >
    Where an atomic transaction chooses exactly one of several alternative
    events (e.g. a fill opens|adjusts|closes a position), all alternatives are
    listed in `emits` for completeness and the exclusive-choice is stated in
    `note`. No synthetic combined event names are used, so the emitted-event
    exact-match audit resolves cleanly.
  - >
    legal_source_states uses "n/a — <reason>" wherever the source prose does not
    define a multi-state lifecycle for that event (single-shot publish/registration,
    classification changes, or condition-gated writes with no prior aggregate
    state). This is deliberate honesty, not missing work.

commands:
  # =====================================================================
  # governance_model_registry — policy / model registry (all single-shot)
  # =====================================================================
  - command: PublishPolicyBundle
    owner_context: governance_model_registry
    legal_source_states: ["n/a — governance publish; no explicit multi-state lifecycle in source docs"]
    target_aggregate: PolicyBundle
    idempotency_scope: "(command_owner, idempotency_key)"
    emits: [PolicyBundlePublished]

  - command: PublishRightsPolicy
    owner_context: governance_model_registry
    legal_source_states: ["n/a — governance publish; no explicit multi-state lifecycle in source docs"]
    target_aggregate: RightsPolicy
    idempotency_scope: "(command_owner, idempotency_key)"
    emits: [RightsPolicyPublished]

  - command: RegisterModelCore
    owner_context: governance_model_registry
    legal_source_states: ["n/a — registers a ModelCore behavior contract (§8.3); no prior canonical state"]
    target_aggregate: ModelCore
    idempotency_scope: "(command_owner, idempotency_key)"
    emits: [ModelCoreRegistered]

  - command: ApproveModelSnapshot
    owner_context: governance_model_registry
    legal_source_states: ["n/a — no prior canonical snapshot state; approval follows the §8.5 eight-step upgrade qualification and two-person approval"]
    target_aggregate: ModelSnapshot
    idempotency_scope: "(command_owner, idempotency_key)"
    emits: [ModelSnapshotApproved]

  - command: DeprecateModelSnapshot
    owner_context: governance_model_registry
    legal_source_states: ["ModelSnapshot previously ModelSnapshotApproved (active); deprecation keeps the same core_contract_revision unless behavior trade-offs changed (§8.5)"]
    target_aggregate: ModelSnapshot
    idempotency_scope: "(command_owner, idempotency_key)"
    emits: [ModelSnapshotDeprecated]

  - command: PublishPromptTemplate
    owner_context: governance_model_registry
    legal_source_states: ["n/a — governance publish; no explicit multi-state lifecycle in source docs"]
    target_aggregate: PromptTemplate
    idempotency_scope: "(command_owner, idempotency_key)"
    emits: [PromptTemplatePublished]

  - command: PublishFallbackPolicy
    owner_context: governance_model_registry
    legal_source_states: ["n/a — governance publish; no explicit multi-state lifecycle in source docs"]
    target_aggregate: PolicyBundle
    idempotency_scope: "(command_owner, idempotency_key)"
    emits: [FallbackPolicyPublished]
    note: "The owner map declares no dedicated FallbackPolicy aggregate; fallback policy revisions (§8.3 ModelCoreContract.fallbackPolicyRevision, §8.4) are governed under the PolicyBundle aggregate."

  # =====================================================================
  # market_evidence_gateway — sealed-fact ingest (§6.3 ingest state machine)
  # =====================================================================
  - command: AcceptFactManifest
    owner_context: market_evidence_gateway
    legal_source_states: ["manifest reached AVAILABLE_TO_WORLD via RECEIVED -> HASH_VERIFIED -> SIGNATURE_VERIFIED -> CONTRACT_VERIFIED -> RIGHTS_VERIFIED -> TIME_VERIFIED -> MIRRORED -> AVAILABLE_TO_WORLD (§6.3)"]
    target_aggregate: FactManifestMirror
    idempotency_scope: "(command_owner, idempotency_key) — manifestId + manifestHash"
    emits: [FactManifestAccepted]

  - command: MirrorFactRevision
    owner_context: market_evidence_gateway
    legal_source_states: ["manifest MIRRORED; each fact revision has an unbroken supersedes chain (§6.2)"]
    target_aggregate: FactRevisionChain
    idempotency_scope: "(command_owner, idempotency_key) — fact revision id"
    emits: [FactRevisionMirrored]

  - command: QuarantineFactManifest
    owner_context: market_evidence_gateway
    legal_source_states: ["any ingest step failed from RECEIVED | HASH_VERIFIED | SIGNATURE_VERIFIED | CONTRACT_VERIFIED | RIGHTS_VERIFIED | TIME_VERIFIED -> QUARANTINED (missing field / hash mismatch / unsupported major / rights unknown / time contradiction / revision gap; fail closed, §6.3)"]
    target_aggregate: FactManifestMirror
    idempotency_scope: "(command_owner, idempotency_key)"
    emits: [FactManifestQuarantined]

  - command: RevokeFactRights
    owner_context: market_evidence_gateway
    legal_source_states: ["manifest MIRRORED | AVAILABLE_TO_WORLD -> REVOKED; immediately blocks new cognition and new public projection (§6.3)"]
    target_aggregate: FactManifestMirror
    idempotency_scope: "(command_owner, idempotency_key)"
    emits: [FactRightsRevoked]

  - command: AcceptMarketSessionFinality
    owner_context: market_evidence_gateway
    legal_source_states: ["n/a — no explicit MarketSession lifecycle in source docs; finality accepted per finalityPolicyRevision, gating post-hoc outcome/editorial evidence (§6.2, §11.2)"]
    target_aggregate: MarketSession
    idempotency_scope: "(command_owner, idempotency_key) — marketSessionId"
    emits: [MarketSessionFinalityAccepted]

  - command: ObserveFactCorrection
    owner_context: market_evidence_gateway
    legal_source_states: ["n/a — no explicit FactRevisionChain lifecycle; a correction arriving after a decision-input seal becomes a later world event and never rewrites what the character knew (§6.3)"]
    target_aggregate: FactRevisionChain
    idempotency_scope: "(command_owner, idempotency_key)"
    emits: [FactCorrectionObserved]

  # =====================================================================
  # world_clock_scene — world time, scenes, encounters, SceneSeed (§7, §12.2)
  # =====================================================================
  - command: OpenWorldSession
    owner_context: world_clock_scene
    legal_source_states: ["n/a — opens a new Asia/Taipei market-day WorldSession with authoritative clock revision (§7.1)"]
    target_aggregate: WorldSession
    idempotency_scope: "(command_owner, idempotency_key)"
    emits: [WorldSessionOpened]

  - command: CommitWorldTick
    owner_context: world_clock_scene
    legal_source_states: ["WorldSession open (between WorldSessionOpened and WorldSessionClosed); scheduled tick or event tick; one writer ownership epoch per (logical_cell_id, world_tick_id) (§7.1)"]
    target_aggregate: WorldSession
    idempotency_scope: "(command_owner, idempotency_key) — world_tick_id"
    emits: [WorldTickCommitted]

  - command: ScheduleDeadline
    owner_context: world_clock_scene
    legal_source_states: ["WorldSession open; every wake/open/close/publish/entitlement/migration deadline is written as DeadlineScheduled before any worker fires it (§7.1)"]
    target_aggregate: WorldSession
    idempotency_scope: "(command_owner, idempotency_key)"
    emits: [DeadlineScheduled]

  - command: FireDeadline
    owner_context: world_clock_scene
    legal_source_states: ["a prior DeadlineScheduled that has come due; worker fires with a fixed idempotency key (§7.1)"]
    target_aggregate: WorldSession
    idempotency_scope: "(command_owner, idempotency_key) — deadline id"
    emits: [DeadlineFired]

  - command: MakeFactVisible
    owner_context: world_clock_scene
    legal_source_states: ["n/a — no multi-state lifecycle; emitted when a mirrored fact revision meets interaction eligibility available_at <= min(character_world_time, interactionCutoffAt) (§6.2)"]
    target_aggregate: Scene
    idempotency_scope: "(command_owner, idempotency_key)"
    emits: [FactBecameVisible]

  - command: ScheduleCharacterExposure
    owner_context: world_clock_scene
    legal_source_states: ["n/a — no multi-state lifecycle; schedules a candidate fact/material into a scene a character can reach; stays CharacterExposureScheduled until actually contacted (char-story-engine 接觸候選)"]
    target_aggregate: Scene
    idempotency_scope: "(command_owner, idempotency_key)"
    emits: [CharacterExposureScheduled]

  - command: EnterScene
    owner_context: world_clock_scene
    legal_source_states: ["Character continuity class PUBLIC and not currently present in the scene; scene boundary with no open cognition/pending fill/relationship settlement/privacy hold (§7.3)"]
    target_aggregate: Presence
    idempotency_scope: "(command_owner, idempotency_key)"
    emits: [CharacterEnteredScene]

  - command: LeaveScene
    owner_context: world_clock_scene
    legal_source_states: ["Character currently present in the scene (a prior CharacterEnteredScene) at a scene boundary (§7.3)"]
    target_aggregate: Presence
    idempotency_scope: "(command_owner, idempotency_key)"
    emits: [CharacterLeftScene]

  - command: OpenEncounterWindow
    owner_context: world_clock_scene
    legal_source_states: ["n/a — opens an EncounterWindow from the deterministic candidate scheduler on position/rhythm/relationship/event match (§7.3); no prior window state"]
    target_aggregate: EncounterWindow
    idempotency_scope: "(command_owner, idempotency_key)"
    emits: [EncounterWindowOpened]

  - command: ResolveEncounter
    owner_context: world_clock_scene
    legal_source_states: ["an open EncounterWindow (EncounterWindowOpened); staging decides positions/turn/silence but never produces dialogue (§7.3)"]
    target_aggregate: EncounterWindow
    idempotency_scope: "(command_owner, idempotency_key)"
    emits: [EncounterResolved]

  - command: RequestSceneSeed
    owner_context: world_clock_scene
    legal_source_states: ["n/a — creates a SceneSeed (REQUESTED); must reference the Identity CommandAdmissionReceiptV1 body digest (QuotaReserved); World may not accept a seed stream without prior quota admission (§12.2)"]
    target_aggregate: SceneSeed
    idempotency_scope: "sceneSeedId (bound to admission body digest + quotaWindowId)"
    emits: [SceneSeedRequested]

  - command: SealSceneSeedArtifact
    owner_context: world_clock_scene
    legal_source_states: ["SceneSeed in VALIDATING (from SceneSeedRequested); seals SceneSeedValidated + normalized ValidatedSceneSeedPayloadV1 bytes + policy/template/source refs + payload digest + deadline + quota-consumption-request outbox; artifact may not yet enter scheduler or cognition (§5.3, §12.2)"]
    target_aggregate: SceneSeed
    idempotency_scope: "(sceneSeedId, quotaWindowId)"
    emits: [SceneSeedValidated]
    note: "§5.3 atomic transaction. SceneSeedValidated is packaged into SceneSeedValidatedReceiptV1; the receipt/outbox are not canonical events."

  - command: AcceptSceneSeed
    owner_context: world_clock_scene
    legal_source_states: ["SceneSeed validated-but-inert with a verified Identity QuotaConsumed acknowledgement for the same seed/window; World only verifies refs and idempotently finalizes; may not run rejecting moderation/rights/deadline/policy validation here (§5.3, §12.2)"]
    target_aggregate: SceneSeed
    idempotency_scope: "(sceneSeedId, quotaWindowId)"
    emits: [SceneSeedAccepted]
    note: "§5.3 atomic transaction. Enables the already-sealed SceneSeedArtifactV1 and writes the scheduler outbox; state -> DEFERRED | SCHEDULED."

  - command: RejectSceneSeed
    owner_context: world_clock_scene
    legal_source_states: ["SceneSeed in VALIDATING only (World may reject a seed only during VALIDATING; never after SceneSeedAccepted, §12.2)"]
    target_aggregate: SceneSeed
    idempotency_scope: "(sceneSeedId, quotaWindowId)"
    emits: [SceneSeedRejected]
    note: "Co-commits a quota-release-request outbox; Identity later emits QuotaReservationReleased (ReleaseQuotaReservation)."

  - command: DeferSceneSeed
    owner_context: world_clock_scene
    legal_source_states: ["SceneSeed ACCEPTED (§12.2 graph SceneSeedAccepted -> DEFERRED | SCHEDULED)"]
    target_aggregate: SceneSeed
    idempotency_scope: "sceneSeedId"
    emits: [SceneSeedDeferred]

  - command: ScheduleSceneSeed
    owner_context: world_clock_scene
    legal_source_states: ["SceneSeed ACCEPTED | DEFERRED (§12.2)"]
    target_aggregate: SceneSeed
    idempotency_scope: "sceneSeedId"
    emits: [SceneSeedScheduled]

  - command: PresentSceneSeed
    owner_context: world_clock_scene
    legal_source_states: ["SceneSeed DEFERRED | SCHEDULED -> PRESENTED (§12.2); presenting establishes a normal world condition, not a cognition patch"]
    target_aggregate: SceneSeed
    idempotency_scope: "sceneSeedId"
    emits: [SceneSeedPresented]

  - command: AcknowledgeSceneSeedObserved
    owner_context: world_clock_scene
    legal_source_states: ["SceneSeed PRESENTED; Cognition sent AcknowledgeSceneSeedObservation whose ObservedClueRegistered references the same SceneSeedPresented; World verifies seed/target/source-event/current-state (§12.2)"]
    target_aggregate: SceneSeed
    idempotency_scope: "(sceneSeedId, source ObservedClueRegistered event ref)"
    emits: [SceneSeedObserved]
    note: "World writes its own canonical lifecycle acknowledgement; it does not copy clue content and is not written by a projection worker."

  - command: IgnoreSceneSeed
    owner_context: world_clock_scene
    legal_source_states: ["SceneSeed PRESENTED (§12.2 PRESENTED -> OBSERVED | IGNORED); the character's own ignoring is in-world behavior, not a policy rejection"]
    target_aggregate: SceneSeed
    idempotency_scope: "sceneSeedId"
    emits: [SceneSeedIgnored]

  - command: ExpireSceneSeed
    owner_context: world_clock_scene
    legal_source_states: ["SceneSeed ACCEPTED | DEFERRED | SCHEDULED with no legal window before its deadline (§12.2)"]
    target_aggregate: SceneSeed
    idempotency_scope: "sceneSeedId"
    emits: [SceneSeedExpired]

  - command: VoidSceneSeed
    owner_context: world_clock_scene
    legal_source_states: ["SceneSeed ACCEPTED | DEFERRED | SCHEDULED; rights revoke / deadline / new policy after QuotaConsumed, or account deletion before PRESENTED (§12.2)"]
    target_aggregate: SceneSeed
    idempotency_scope: "sceneSeedId"
    emits: [SceneSeedVoided]

  - command: WithdrawSceneSeed
    owner_context: world_clock_scene
    legal_source_states: ["SceneSeed ACCEPTED | DEFERRED | SCHEDULED, only before PRESENTED; once any character may contact it the viewer cannot rewind (§12.2)"]
    target_aggregate: SceneSeed
    idempotency_scope: "sceneSeedId"
    emits: [SceneSeedWithdrawn]

  - command: CloseWorldSession
    owner_context: world_clock_scene
    legal_source_states: ["WorldSession open (a prior WorldSessionOpened); end of the Asia/Taipei trading day (§7.1)"]
    target_aggregate: WorldSession
    idempotency_scope: "(command_owner, idempotency_key)"
    emits: [WorldSessionClosed]

  # =====================================================================
  # character_origin — introduction lifecycle & continuity (§8.2, §7.2.1)
  # =====================================================================
  - command: RequestIntroduction
    owner_context: character_origin
    legal_source_states: ["n/a — creates an Introduction (REQUESTED); must reference the Identity CommandAdmissionReceiptV1 body digest, commandAcceptedAt and quota window and may not re-sample server time (§5.3, §8.2)"]
    target_aggregate: Introduction
    idempotency_scope: "introduction_id (bound to CommandAdmissionReceiptBodyV1.idempotencyKeyDigest / quota window)"
    emits: [IntroductionRequested]

  - command: ReserveIntroductionCapacity
    owner_context: character_origin
    legal_source_states: ["Introduction in CAPACITY_CHECKING; a long-tail obligation budget granted from the measured cost model (§7.2.2), advancing to CAPACITY_RESERVED"]
    target_aggregate: Introduction
    idempotency_scope: "(introduction_id, reservation_id, quota_window_id)"
    emits: [IntroductionCapacityReserved]

  - command: WaitlistIntroductionCapacity
    owner_context: character_origin
    legal_source_states: ["Introduction in CAPACITY_CHECKING with insufficient capacity -> WAITING_FOR_CAPACITY; keeps the same request/seed, consumes no quota, creates no public character (§7.2.2)"]
    target_aggregate: Introduction
    idempotency_scope: "(introduction_id, quota_window_id)"
    emits: [IntroductionCapacityWaitlisted]

  - command: ValidateIntroduction
    owner_context: character_origin
    legal_source_states: ["Introduction CAPACITY_RESERVED -> VALIDATING with age / real-person similarity / content / rights / identity business gates passed (§8.2)"]
    target_aggregate: Introduction
    idempotency_scope: "(command_owner, idempotency_key) — introduction_id"
    emits: [IntroductionValidated]

  - command: SealCharacterOrigin
    owner_context: character_origin
    legal_source_states: ["Introduction in VALIDATING with all business gates passed and no existing CharacterOriginSealed; single SERIALIZABLE transaction advancing to ORIGIN_SEALED then ASSET_PACK_BUILDING; excludes external image work (§5.3, §8.2)"]
    target_aggregate: [Introduction, Character, CharacterAssetPack]
    idempotency_scope: "(command_owner, idempotency_key) — introduction_id"
    emits: [CharacterOriginSealed, ModelCoreAssigned, CharacterAssetPackRequested]
    note: "§5.3 atomic transaction: Introduction state + Character origin blob + model-core assignment + asset-request outbox. After CharacterOriginSealed the life is fixed and cannot be re-rolled."

  - command: QualifyCharacterAssetPack
    owner_context: character_origin
    legal_source_states: ["Introduction in ASSET_PACK_QUALIFYING; the minimum CharacterAssetPack passed every crop/rig/voice/age/identity/rights/hash/human-approval gate (§8.2), advancing to READY_FOR_ACTIVATION eligibility"]
    target_aggregate: CharacterAssetPack
    idempotency_scope: "(command_owner, idempotency_key) — asset_pack_digest"
    emits: [CharacterAssetPackQualified]

  - command: RejectCharacterAssetPack
    owner_context: character_origin
    legal_source_states: ["Introduction in ASSET_PACK_BUILDING | ASSET_PACK_QUALIFYING; failed qualification -> RETRY_PENDING (retryable) or FAILED_TERMINAL (unrecoverable) (§8.2)"]
    target_aggregate: CharacterAssetPack
    idempotency_scope: "(command_owner, idempotency_key)"
    emits: [CharacterAssetPackRejected]

  - command: MarkIntroductionReadyForActivation
    owner_context: character_origin
    legal_source_states: ["Introduction in ASSET_PACK_QUALIFYING with CharacterAssetPackQualified; seals IntroductionReadyReceiptBodyV1 in the same transaction, advancing to READY_FOR_ACTIVATION (§8.2)"]
    target_aggregate: Introduction
    idempotency_scope: "(command_owner, idempotency_key) — introduction_id"
    emits: [IntroductionReadyForActivation]

  - command: AcknowledgeIntroductionActivation
    owner_context: character_origin
    legal_source_states: ["Introduction in AWAITING_IDENTITY_ACK; verified Identity QuotaConsumed + IntroducerBondCreated acknowledgement matching the same ready-receipt body digest; advances to AWAITING_ARRIVAL_NODE; no rejecting validation after QuotaConsumed (§8.2)"]
    target_aggregate: Introduction
    idempotency_scope: "introduction_id (matched to acknowledgement event ref / ready-receipt body digest)"
    emits: [IntroductionActivationAcknowledged]

  - command: IntroduceCharacter
    owner_context: character_origin
    legal_source_states: ["Introduction in AWAITING_ARRIVAL_NODE; the next valid world node; idempotent finalize only, advancing to ACTIVATED (§8.2)"]
    target_aggregate: [Introduction, Character]
    idempotency_scope: "introduction_id"
    emits: [CharacterIntroduced]

  - command: FailIntroduction
    owner_context: character_origin
    legal_source_states: ["Introduction in VALIDATING | ASSET_PACK_BUILDING | ASSET_PACK_QUALIFYING -> FAILED_TERMINAL; only for age / real-person / content-safety / rights / identity / asset human-approval / unrecoverable-schema failures; must occur before QuotaConsumed (§8.2)"]
    target_aggregate: Introduction
    idempotency_scope: "(introduction_id, reservation_id, quota_window_id, request_digest)"
    emits: [IntroductionFailed, IntroductionCapacityReleased]
    note: "§8.2 co-committed transaction: the IntroductionFailed local transaction also writes IntroductionCapacityReleased (if reserved) + quota-release-request outbox. IntroductionCapacityReleased is also emitted by CancelIntroductionBeforeOrigin."

  - command: CancelIntroductionBeforeOrigin
    owner_context: character_origin
    legal_source_states: ["Introduction in REQUESTED | CAPACITY_CHECKING | WAITING_FOR_CAPACITY | CAPACITY_RESERVED | VALIDATING; accepted only while no CharacterOriginSealed exists and QuotaConsumed has not occurred; advances to CANCELLATION_PENDING (§8.2)"]
    target_aggregate: Introduction
    idempotency_scope: "(introduction_id, reservation_id, quota_window_id, request_digest)"
    emits: [IntroductionCancellationRequested, IntroductionCapacityReleased]
    note: "§8.2 co-committed transaction: cancellation-request + origin-seal fence + IntroductionCapacityReleased (if reserved) + quota-release-request outbox, all-or-nothing. If origin seal wins the race the cancel is rejected."

  - command: ConfirmIntroductionCancelledBeforeOrigin
    owner_context: character_origin
    legal_source_states: ["Introduction in CANCELLATION_PENDING; reconciler dedupes on introduction/reservation/window/request digest after Identity QuotaReservationReleased acknowledgement; advances to CANCELLED_BEFORE_ORIGIN (§8.2)"]
    target_aggregate: Introduction
    idempotency_scope: "(introduction_id, reservation_id, quota_window_id, request_digest)"
    emits: [IntroductionCancelledBeforeOrigin]

  - command: ChangeCharacterContinuityClass
    owner_context: character_origin
    legal_source_states: ["§7.2.1: PUBLIC <-> VISIBILITY_HELD; VISIBILITY_HELD -> WITHDRAWN; PUBLIC -> WITHDRAWN only for immediate safety/legal takedown"]
    target_aggregate: Character
    idempotency_scope: "(command_owner, idempotency_key)"
    emits: [CharacterContinuityClassChanged]
    note: "Character owner writes this; Privacy/Visibility separately advances SubjectLifecycleFenceAdvanced + visibility epoch on a typed command. They never co-write one canonical stream."

  # =====================================================================
  # character_life — dynamic state, belief, claims, thesis, learning
  # =====================================================================
  - command: AdvanceCharacterState
    owner_context: character_life
    legal_source_states: ["n/a — deterministic sleep/life-pressure/recovery/daily-rhythm state patch (char-story-engine 正式事件); scheduled or event tick"]
    target_aggregate: CharacterLife
    idempotency_scope: "(command_owner, idempotency_key)"
    emits: [CharacterStateAdvanced]

  - command: AdvanceNeedState
    owner_context: character_life
    legal_source_states: ["n/a — needs/goals re-prioritization on the months-to-years timescale (char-story-engine 動態狀態與生活壓力); no single market move rewrites long-term personality"]
    target_aggregate: CharacterLife
    idempotency_scope: "(command_owner, idempotency_key)"
    emits: [NeedStateAdvanced]

  - command: AdvanceEmotionState
    owner_context: character_life
    legal_source_states: ["follows a normalized interpretation for the same CognitiveEpisode (fixed sequence step 4, §8.4 / char-story-engine 從事件到行為); bounded per-event increment; the model may not submit this event directly"]
    target_aggregate: CharacterLife
    idempotency_scope: "(command_owner, idempotency_key)"
    emits: [EmotionStateAdvanced]

  - command: ReviseBelief
    owner_context: character_life
    legal_source_states: ["an existing belief/thesis; new evidence creates a revision recording whether the character admits changing; may not silently overwrite the original rationale (char-story-engine 信念與自我敘述)"]
    target_aggregate: CharacterLife
    idempotency_scope: "(command_owner, idempotency_key)"
    emits: [BeliefRevised]

  - command: AdvanceBehaviorHypothesis
    owner_context: character_life
    legal_source_states: ["pattern_hypothesis lifecycle CANDIDATE -> SUPPORTED -> REPEATED -> REVISED; SUPPORTED needs a second independent event with a similar trigger/behavior chain; counter-examples lower confidence (char-story-engine 認知傾向)"]
    target_aggregate: CharacterLife
    idempotency_scope: "(command_owner, idempotency_key)"
    emits: [BehaviorHypothesisAdvanced]

  - command: ActivateBehaviorMarker
    owner_context: character_life
    legal_source_states: ["n/a — no discrete lifecycle; fires only when typed evidence for a pattern is present and may state only which pattern a behavior segment matches, never a sole inner cause (§9.4)"]
    target_aggregate: CharacterLife
    idempotency_scope: "(command_owner, idempotency_key)"
    emits: [BehaviorMarkerActivated]

  - command: OpenThesis
    owner_context: character_life
    legal_source_states: ["n/a — opens a company thesis (ThesisOpened) as the first step of the paper-action sequence (char-story-engine 自主紙上交易); no prior thesis state"]
    target_aggregate: CharacterLife
    idempotency_scope: "(command_owner, idempotency_key)"
    emits: [ThesisOpened]

  - command: ReviseThesis
    owner_context: character_life
    legal_source_states: ["an open Thesis (ThesisOpened); revision keeps the original claim/timestamps and records new supporting evidence (char-story-engine 自主紙上交易)"]
    target_aggregate: CharacterLife
    idempotency_scope: "(command_owner, idempotency_key)"
    emits: [ThesisRevised]

  - command: DetectThesisDrift
