    idempotency_scope: "(subject, introduction_id, quotaWindowId)"
    emits: [IntroducerBondCreated]

  - command: ChangeIntroducerBondState
    owner_context: identity_entitlement
    legal_source_states: ["an existing IntroducerBond; §12.3 CONTROLLED_INTRODUCER -> GRACE -> PUBLIC_UNCONTROLLED; PUBLIC_UNCONTROLLED -> RESTORE_PENDING -> CONTROLLED_INTRODUCER; any state -> DELETION_PENDING -> DETACHED"]
    target_aggregate: IntroducerBond
    idempotency_scope: "(command_owner, idempotency_key)"
    emits: [IntroducerBondStateChanged]

  - command: ChangeBillingSubscriptionState
    owner_context: identity_entitlement
    legal_source_states: ["an existing BillingSubscription; pending | active | grace | expired | refunded | revoked; only server-verified idempotent receipt/webhook transitions may move it (§12, §12.2)"]
    target_aggregate: BillingSubscription
    idempotency_scope: "(command_owner, idempotency_key) — receipt/webhook reference"
    emits: [BillingSubscriptionStateChanged]

  - command: PrepareAccountExport
    owner_context: identity_entitlement
    legal_source_states: ["n/a — no discrete source state; prepares an account data export as a product flow (§13.3)"]
    target_aggregate: Account
    idempotency_scope: "(command_owner, idempotency_key)"
    emits: [AccountExportPrepared]

  - command: BeginAccountDeletion
    owner_context: identity_entitlement
    legal_source_states: ["n/a — Identity-local intent from any active account state; writes only AccountDeletionRequested + deletion job state + privacy-fence-request outbox and never co-writes Privacy's fence/epoch/purge (§5.3, §13.3)"]
    target_aggregate: Account
    idempotency_scope: "(command_owner, idempotency_key) — deletion request digest"
    emits: [AccountDeletionRequested]
    note: "§5.3 atomic transaction. Deletion and unsubscription are entirely different state machines."

  - command: CompleteAccountDeletion
    owner_context: identity_entitlement
    legal_source_states: ["AccountDeletionRequested with all Privacy / Viewer-Library / media purge receipts collected for the same deletion request digest; never faked by timeout (§13.3)"]
    target_aggregate: Account
    idempotency_scope: "(command_owner, idempotency_key) — deletion request digest"
    emits: [AccountDeletionCompleted]

  # =====================================================================
  # privacy_visibility — lifecycle fence, epoch, visibility grants (§13)
  # =====================================================================
  - command: AdvanceSubjectLifecycleFence
    owner_context: privacy_visibility
    legal_source_states: ["a typed privacy-fence-request from Identity (e.g. the AccountDeletionRequested outbox); Privacy writes it in its own local transaction and Identity may not co-write (§13.3)"]
    target_aggregate: SubjectLifecycleFence
    idempotency_scope: "(command_owner, idempotency_key) — deletion/fence request digest"
    emits: [SubjectLifecycleFenceAdvanced]

  - command: AdvanceVisibilityEpoch
    owner_context: privacy_visibility
    legal_source_states: ["a lifecycle/withdrawal/deletion event requiring an epoch bump; old-epoch events are rejected thereafter and cannot be resurrected (§13.2, §13.3)"]
    target_aggregate: VisibilityGrant
    idempotency_scope: "(command_owner, idempotency_key)"
    emits: [VisibilityEpochAdvanced]

  - command: WithdrawSubjectVisibility
    owner_context: privacy_visibility
    legal_source_states: ["a rights revoke / withdrawal / continuity-class change requiring public content removal; public read model keeps only a policy-safe tombstone (§7.2.1, §13)"]
    target_aggregate: SubjectLifecycleFence
    idempotency_scope: "(command_owner, idempotency_key)"
    emits: [SubjectVisibilityWithdrawn]

  - command: GrantPublicVisibility
    owner_context: privacy_visibility
    legal_source_states: ["Privacy verified audience, market-time fence, rights and visibility epoch for a StoryChapterPublished; written in Privacy's own transaction (§5.3, §11.2)"]
    target_aggregate: VisibilityGrant
    idempotency_scope: "(command_owner, idempotency_key)"
    emits: [PublicVisibilityGranted]

  - command: GrantSubscriberArchiveVisibility
    owner_context: privacy_visibility
    legal_source_states: ["Privacy verified subscriber-archive audience, rights and visibility epoch for published content (§5.3, §11.3)"]
    target_aggregate: VisibilityGrant
    idempotency_scope: "(command_owner, idempotency_key)"
    emits: [SubscriberArchiveVisibilityGranted]
